name: Release

# Build and publish to PyPI when a version tag (v*) is pushed. Uses PyPI Trusted Publishing (OIDC):
# PyPI trusts THIS repo's release workflow, so no API token is stored anywhere. One-time setup is a
# trusted publisher on the phylustrator project — see RELEASING.md.
on:
  push:
    tags:
      - "v*"

jobs:
  # Gate the release on the test suite (a tag can point anywhere; don't publish red code).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # the OIDC token is the only credential — no PyPI secret needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(ls dist/*.whl | sed -E 's/.*phylustrator-([0-9][^-]*)-.*/\1/')"
          echo "tag=$tag  package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag does not match package version $pkg — bump pyproject.toml"; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The tag alone leaves the repo showing "6 tags · Create a new release" and no version anywhere a
  # reader looks. Publishing the Release is what puts the number on the repo page, so it is done here
  # rather than by hand — a tag pushed without one is the state this fixes.
  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write          # creating a Release writes to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # --generate-notes reads the log back to the previous tag
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
